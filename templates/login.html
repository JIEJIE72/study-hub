<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body style="font-family:Arial; padding:50px; background:#f4f4f4;">

<div style="max-width:300px; margin:auto; background:white; padding:20px; border-radius:10px;">

    <h2 style="text-align:center;">Study Hub Login</h2>

    {% if error %}
        <p style="color:red; text-align:center;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Username</label><br>
        <input name="username" style="width:100%; padding:8px;"><br><br>

        <label>Password</label><br>
        <input type="password" name="password" style="width:100%; padding:8px;"><br><br>

        <button style="width:100%; padding:10px; background:black; color:white;">
            Login
        </button>

    </form>

</div>

</body>
</html>
